<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon Carnet de Recettes Salées</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Lora:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        /* ==========================================================================
           VARIABLES ET BASE
           ========================================================================== */
        :root {
            --bg-color: #e6dfd5;
            --paper-color: #fdfaf6;
            --primary-text: #3e3832;
            --accent-color: #722f37; /* Bordeaux */
            --secondary-accent: #556b2f; /* Vert olive */
            --border-color: #e0d5c1;
            --font-title: 'Playfair Display', serif;
            --font-text: 'Lora', serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            background-image: radial-gradient(#e0d5c1 1px, transparent 1px);
            background-size: 20px 20px;
            color: var(--primary-text);
            font-family: var(--font-text);
            line-height: 1.6;
        }

        /* ==========================================================================
           MISE EN PAGE PRINCIPALE
           ========================================================================== */
        .app-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        header {
            text-align: center;
            margin-bottom: 50px;
        }

        header h1 {
            font-family: var(--font-title);
            color: var(--accent-color);
            font-size: 3.5rem;
            margin-bottom: 10px;
        }

        header p {
            font-size: 1.2rem;
            font-style: italic;
            color: var(--secondary-accent);
        }

        /* ==========================================================================
           SECTION DES FILTRES
           ========================================================================== */
        .filters-section {
            background-color: var(--paper-color);
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            margin-bottom: 40px;
            border: 1px solid var(--border-color);
        }

        .filter-group {
            margin-bottom: 20px;
        }

        .filter-group:last-child {
            margin-bottom: 0;
        }

        .filter-title {
            font-family: var(--font-title);
            font-size: 1.2rem;
            color: var(--accent-color);
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn-group {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .filter-btn {
            background: none;
            border: 1px solid var(--border-color);
            padding: 8px 16px;
            border-radius: 20px;
            font-family: var(--font-text);
            color: var(--primary-text);
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.95rem;
        }

        .filter-btn:hover {
            border-color: var(--secondary-accent);
            color: var(--secondary-accent);
        }

        .filter-btn.active {
            background-color: var(--secondary-accent);
            color: white;
            border-color: var(--secondary-accent);
        }

        /* Cas spécifique pour les catégories (bordeaux) */
        .cat-btn.active {
            background-color: var(--accent-color);
            border-color: var(--accent-color);
        }

        /* ==========================================================================
           GRILLE DE RECETTES
           ========================================================================== */
        .recipe-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 30px;
        }

        .recipe-card {
            background-color: var(--paper-color);
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
            border: 1px solid var(--border-color);
            cursor: pointer;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            display: flex;
            flex-direction: column;
        }

        .recipe-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.12);
        }

        .recipe-img-container {
            height: 200px;
            width: 100%;
            overflow: hidden;
            position: relative;
        }

        .recipe-img-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .recipe-card:hover .recipe-img-container img {
            transform: scale(1.05);
        }

        .recipe-category-badge {
            position: absolute;
            top: 10px;
            right: 10px;
            background-color: rgba(253, 250, 246, 0.9);
            color: var(--accent-color);
            padding: 4px 12px;
            border-radius: 15px;
            font-size: 0.8rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .recipe-info {
            padding: 20px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .recipe-title {
            font-family: var(--font-title);
            font-size: 1.5rem;
            color: var(--accent-color);
            margin-bottom: 10px;
        }

        .recipe-desc {
            font-size: 0.95rem;
            margin-bottom: 15px;
            flex-grow: 1;
        }

        .recipe-meta {
            display: flex;
            align-items: center;
            gap: 15px;
            font-size: 0.9rem;
            color: var(--secondary-accent);
            font-style: italic;
        }

        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 50px;
            font-size: 1.2rem;
            color: var(--accent-color);
            font-style: italic;
        }

        /* ==========================================================================
           LIVRE OUVERT (MODAL)
           ========================================================================== */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(62, 56, 50, 0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            padding: 20px;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .book-container {
            background-color: var(--paper-color);
            width: 100%;
            max-width: 1000px;
            max-height: 90vh;
            border-radius: 8px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
            display: flex;
            position: relative;
            overflow: hidden;
            transform: translateY(20px);
            transition: transform 0.3s ease;
        }

        .modal-overlay.active .book-container {
            transform: translateY(0);
        }

        /* Ligne centrale du livre */
        .book-container::after {
            content: '';
            position: absolute;
            left: 50%;
            top: 0;
            bottom: 0;
            width: 2px;
            background: linear-gradient(to right, rgba(0,0,0,0.1), rgba(0,0,0,0.05));
            box-shadow: inset 1px 0 3px rgba(0,0,0,0.1);
        }

        .book-page {
            width: 50%;
            padding: 40px;
            overflow-y: auto;
        }

        .book-page-left {
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
        }

        .close-btn {
            position: absolute;
            top: 15px;
            right: 20px;
            background: none;
            border: none;
            font-size: 24px;
            color: var(--accent-color);
            cursor: pointer;
            z-index: 10;
        }

        .book-title {
            font-family: var(--font-title);
            font-size: 2.5rem;
            color: var(--accent-color);
            margin-bottom: 20px;
            line-height: 1.1;
        }

        .book-meta {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            color: var(--secondary-accent);
            font-style: italic;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
        }

        .book-image {
            width: 100%;
            height: 250px;
            object-fit: cover;
            border-radius: 4px;
            margin-bottom: 20px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }

        .ingredients-list {
            list-style: none;
        }

        .ingredients-list li {
            padding: 8px 0;
            border-bottom: 1px dashed var(--border-color);
            position: relative;
            padding-left: 20px;
        }
        
        .ingredients-list li::before {
            content: '•';
            color: var(--secondary-accent);
            position: absolute;
            left: 0;
            font-size: 1.2rem;
        }

        .book-subtitle {
            font-family: var(--font-title);
            font-size: 1.5rem;
            color: var(--accent-color);
            margin: 20px 0 15px 0;
        }

        .steps-list {
            list-style: none;
            counter-reset: step-counter;
        }

        .steps-list li {
            position: relative;
            padding-left: 40px;
            margin-bottom: 20px;
        }

        .steps-list li::before {
            counter-increment: step-counter;
            content: counter(step-counter);
            position: absolute;
            left: 0;
            top: 0;
            width: 25px;
            height: 25px;
            background-color: var(--secondary-accent);
            color: white;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: var(--font-title);
            font-size: 0.9rem;
        }

        /* Responsive pour petits écrans */
        @media (max-width: 768px) {
            .book-container {
                flex-direction: column;
                overflow-y: auto;
            }
            .book-container::after {
                display: none;
            }
            .book-page {
                width: 100%;
                padding: 20px;
                overflow-y: visible;
            }
            .book-page-left {
                border-right: none;
                border-bottom: 1px solid var(--border-color);
            }
        }
    </style>
</head>
<body>

        <!-- Filtres Interactifs -->

                <div class="btn-group" id="ingredient-filters">
                    <!-- Les boutons seront générés en JS -->
                </div>
            </div>
        </section>

        <!-- Grille d'affichage des résultats -->
        <main class="recipe-grid" id="recipe-grid">
            <!-- Les recettes seront injectées ici par JavaScript -->
        </main>
    </div>

    <!-- Modale "Livre Ouvert" pour lire une recette -->

                <h3 class="book-subtitle">Dans le panier :</h3>

                    <!-- Liste des ingrédients -->
                </ul>
            </div>
            
            <!-- Page de droite : Préparation -->
            <div class="book-page book-page-right">
                <h3 class="book-subtitle">Aux fourneaux :</h3>
                <ul class="steps-list" id="modal-steps">
                    <!-- Étapes de préparation -->
                </ul>
            </div>
        </div>
    </div>

                    "Beurrer les parties extérieures du pain et assembler le tout.",

        /* ==========================================================================
           LOGIQUE DE L'APPLICATION (Le "Moteur")
           ========================================================================== */
        
        let currentCategory = "Toutes";
        let activeIngredients = new Set(); // Conserve les ingrédients cliqués

        // 1. Initialisation
        function initApp() {
            extractAndRenderFilters();
            renderRecipes();
            setupModalListeners();
        }

        // 2. Création automatique des boutons de filtre en fonction des recettes
        function extractAndRenderFilters() {
            const categories = new Set();
            const allIngredients = new Set();

            recipes.forEach(recipe => {
                categories.add(recipe.category);
                recipe.tags.forEach(tag => allIngredients.add(tag));
            });

            // Rendu des catégories
            const catContainer = document.getElementById('category-filters');
            categories.forEach(cat => {
                const btn = document.createElement('button');
                btn.className = 'filter-btn cat-btn';
                btn.textContent = cat;
                btn.dataset.category = cat;
                btn.addEventListener('click', () => {
                    // Gérer l'état actif visuel
                    document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    currentCategory = cat;
                    renderRecipes();
                });
                catContainer.appendChild(btn);
            });

            // Gestionnaire pour le bouton "Toutes" par défaut
            document.querySelector('.cat-btn[data-category="Toutes"]').addEventListener('click', (e) => {
                document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
                currentCategory = "Toutes";
                renderRecipes();
            });

            // Rendu des ingrédients
            const ingContainer = document.getElementById('ingredient-filters');
            const sortedIngredients = Array.from(allIngredients).sort();

            const LIMIT_VISIBLE = 12; // Nombre max d'ingrédients affichés par défaut
            
            sortedIngredients.forEach((ing, index) => {
                const btn = document.createElement('button');
                btn.className = 'filter-btn ing-btn';
                btn.textContent = ing;
                btn.dataset.ingredient = ing;

                // Si on dépasse la limite, on cache l'ingrédient au départ
                if (index >= LIMIT_VISIBLE) {
                    btn.style.display = 'none';
                    btn.classList.add('hidden-ingredient');
                }

                btn.addEventListener('click', () => {
                    // Toggle l'ingrédient
                    if (activeIngredients.has(ing)) {
                        activeIngredients.delete(ing);
                        btn.classList.remove('active');
                    } else {
                        activeIngredients.add(ing);
                        btn.classList.add('active');
                    }
                    renderRecipes();
                });
                ingContainer.appendChild(btn);
            });

            // Si le nombre total d'ingrédients dépasse notre limite, on crée le bouton magique
            if (sortedIngredients.length > LIMIT_VISIBLE) {
                const toggleBtn = document.createElement('button');
                toggleBtn.className = 'filter-btn';
                
                // Style personnalisé pour démarquer le bouton "Voir plus" (Couleur bordeaux)
                toggleBtn.style.color = 'var(--accent-color)';
                toggleBtn.style.borderColor = 'var(--accent-color)';
                toggleBtn.style.fontWeight = 'bold';
                toggleBtn.innerHTML = '<i class="fa-solid fa-chevron-down"></i> Voir plus';

                let isExpanded = false;
                
                toggleBtn.addEventListener('click', () => {
                    isExpanded = !isExpanded;
                    
                    // On récupère tous les boutons masqués pour changer leur affichage
                    const hiddenBtns = ingContainer.querySelectorAll('.hidden-ingredient');
                    hiddenBtns.forEach(btn => {
                        btn.style.display = isExpanded ? 'inline-block' : 'none';
                    });

                    // On met à jour l'intitulé et la flèche du bouton
                    toggleBtn.innerHTML = isExpanded 
                        ? '<i class="fa-solid fa-chevron-up"></i> Voir moins' 
                        : '<i class="fa-solid fa-chevron-down"></i> Voir plus';
                });

                ingContainer.appendChild(toggleBtn);
            }
        }

        // 3. Affichage des recettes filtrées
        function renderRecipes() {
            const grid = document.getElementById('recipe-grid');
            grid.innerHTML = ''; // Nettoyer la grille

            const filteredRecipes = recipes.filter(recipe => {
                // Filtre Catégorie
                const matchCategory = currentCategory === "Toutes" || recipe.category === currentCategory;
                
                // Filtre Ingrédients (Doit contenir au moins UN des ingrédients sélectionnés si des filtres sont actifs)
                // Si vous voulez qu'il contienne TOUS les ingrédients, on changerait .some par .every
                let matchIngredients = true;
                if (activeIngredients.size > 0) {
                    matchIngredients = Array.from(activeIngredients).every(activeIng => recipe.tags.includes(activeIng));
                }

                return matchCategory && matchIngredients;
            });

            if (filteredRecipes.length === 0) {
                grid.innerHTML = `<div class="empty-state">Oh mince ! Aucune recette ne correspond à votre sélection. Essayez d'enlever quelques ingrédients.</div>`;
                return;
            }

            filteredRecipes.forEach(recipe => {
                const card = document.createElement('article');
                card.className = 'recipe-card';
                card.onclick = () => openRecipeModal(recipe);

                card.innerHTML = `
                    <div class="recipe-img-container">
                        <span class="recipe-category-badge">${recipe.category}</span>
                        <img src="${recipe.image}" alt="${recipe.title}" loading="lazy">
                    </div>
                    <div class="recipe-info">
                        <h3 class="recipe-title">${recipe.title}</h3>
                        <p class="recipe-desc">${recipe.description}</p>
                        <div class="recipe-meta">
                            <span><i class="fa-regular fa-clock"></i> ${recipe.time}</span>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // 4. Gestion de la Modale (Livre ouvert)
        const modal = document.getElementById('recipe-modal');
        const closeModalBtn = document.getElementById('close-modal');

        function openRecipeModal(recipe) {
            // Remplir les données
            document.getElementById('modal-title').textContent = recipe.title;
            document.getElementById('modal-category').innerHTML = `<i class="fa-solid fa-tag"></i> ${recipe.category}`;
            document.getElementById('modal-time').innerHTML = `<i class="fa-regular fa-clock"></i> ${recipe.time}`;
            document.getElementById('modal-image').src = recipe.image;
            document.getElementById('modal-desc').textContent = recipe.description;

            // Remplir les listes
            const ulIngredients = document.getElementById('modal-ingredients');
            ulIngredients.innerHTML = recipe.ingredients.map(ing => `<li>${ing}</li>`).join('');

            const ulSteps = document.getElementById('modal-steps');
            ulSteps.innerHTML = recipe.steps.map(step => `<li>${step}</li>`).join('');

            // Afficher
            modal.classList.add('active');
            document.body.style.overflow = 'hidden'; // Empêcher le scroll du fond
        }

        function setupModalListeners() {
            closeModalBtn.addEventListener('click', () => {
                modal.classList.remove('active');
                document.body.style.overflow = 'auto';
            });

            // Fermer en cliquant à l'extérieur du livre
            modal.addEventListener('click', (e) => {
                if (e.target === modal) {
                    modal.classList.remove('active');
                    document.body.style.overflow = 'auto';
                }
            });
            
            // Fermer avec la touche Echap
            document.addEventListener('keydown', (e) => {
                if(e.key === "Escape" && modal.classList.contains('active')) {
                    modal.classList.remove('active');
                    document.body.style.overflow = 'auto';
                }
            });
        }

        // Lancer l'application au chargement
        window.onload = initApp;

    </script>
</body>
</html>
